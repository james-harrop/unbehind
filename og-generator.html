<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<title>Unbehind OG</title>
<style>
  @font-face {
    font-family: 'Bricolage Grotesque';
    src: url('fonts/bricolage-grotesque.woff2') format('woff2');
    font-weight: 200 800;
  }
  @font-face {
    font-family: 'Newsreader';
    src: url('fonts/newsreader.woff2') format('woff2');
    font-weight: 200 800;
  }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px;
    height: 630px;
    background: #1C3FD7;
    color: #fff;
    font-family: 'Bricolage Grotesque', Arial, sans-serif;
    overflow: hidden;
  }
  .frame {
    position: absolute;
    inset: 0;
    padding: 56px 68px 60px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .wordmark {
    display: flex;
    align-items: center;
    font-weight: 800;
    font-size: 40px;
    letter-spacing: -0.035em;
  }
  .wordmark .un { background: #FFE74A; color: #0C1436; padding: 0 6px 3px 7px; margin-right: 2px; border-radius: 6px; transform: rotate(-2deg); display: inline-block; }
  .headline {
    font-weight: 800;
    font-size: 122px;
    line-height: 0.92;
    letter-spacing: -0.048em;
    max-width: 1040px;
  }
  .foot {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 40px;
  }
  .line {
    font-family: 'Newsreader', Georgia, serif;
    font-size: 34px;
    line-height: 1.25;
    max-width: 720px;
  }
  .tag {
    background: #FFE74A;
    color: #0C1436;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: -0.02em;
    padding: 14px 20px;
    border-radius: 8px;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="wordmark">
      <span class="un">Un</span>behind
    </div>
    <div class="headline">You&rsquo;ve got AI.<br>You&rsquo;ve still got<br>the admin.</div>
    <div class="foot">
      <div class="line">I set up the AI you already pay for to take on the dull stuff. Nothing sent without your say-so.</div>
      <div class="tag">From &pound;195</div>
    </div>
  </div>
</body>
</html>
