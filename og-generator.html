<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<title>Unbehind OG</title>
<style>
  @font-face {
    font-family: 'Bricolage Grotesque';
    src: url('fonts/bricolage-grotesque.woff2') format('woff2');
    font-weight: 200 800;
  }
  @font-face {
    font-family: 'Newsreader';
    src: url('fonts/newsreader.woff2') format('woff2');
    font-weight: 200 800;
  }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px;
    height: 630px;
    background: #1C3FD7;
    color: #fff;
    font-family: 'Bricolage Grotesque', Arial, sans-serif;
    overflow: hidden;
  }
  .frame {
    position: absolute;
    inset: 0;
    padding: 56px 68px 60px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .wordmark {
    display: flex;
    align-items: center;
    gap: 14px;
    font-weight: 800;
    font-size: 36px;
    letter-spacing: -0.035em;
  }
  .wordmark svg { width: 40px; height: 40px; }
  .headline {
    font-weight: 800;
    font-size: 124px;
    line-height: 0.92;
    letter-spacing: -0.048em;
    max-width: 1040px;
  }
  .foot {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 40px;
  }
  .line {
    font-family: 'Newsreader', Georgia, serif;
    font-size: 34px;
    line-height: 1.25;
    max-width: 720px;
  }
  .tag {
    background: #FFE74A;
    color: #0C1436;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: -0.02em;
    padding: 14px 20px;
    border-radius: 8px;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="wordmark">
      <svg viewBox="0 0 26 26"><rect width="26" height="26" rx="6" fill="#FFE74A"/><path d="M6.5 13.6l4.3 4.4 8.7-10" fill="none" stroke="#0C1436" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Unbehind
    </div>
    <div class="headline">You&rsquo;re using AI like a glorified Google.</div>
    <div class="foot">
      <div class="line">I&rsquo;ll sort out the AI you already pay for. In your voice, nothing sent without your say-so.</div>
      <div class="tag">From &pound;195</div>
    </div>
  </div>
</body>
</html>
